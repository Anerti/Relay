          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                invalidUserId:
                  value:
                    status: 400
                    error: BAD REQUEST
                    message: 'Invalid parameter: userId'
                    timestamp: 2026-07-20T15:00:00Z
                malformedBody:
                  value:
                    status: 400
                    error: BAD REQUEST
                    message: Request body is missing or malformed.
                    timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Authentication required.
                timestamp: 2026-07-20T15:00:00Z
        '403':
