        Permanently deletes a conversation the caller owns together with all its
        messages. Returns 404 when the conversation does not exist or belongs to
        another user. This endpoint requires authentication.
      tags: [Conversations]
      security:
        - bearerAuth: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: Conversation and its messages deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ConversationNotFound'

  /conversations/{conversationId}/agent-messages/{agentMessageId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: agentMessageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: editAgentMessage
      summary: Edit a prompt in a conversation
      description: >-
        Replaces the content of a human-issued agent message in a conversation the
        caller owns and sets updatedAt. AI replies are not regenerated. Returns 404 when
        the conversation or agent message does not exist, the conversation belongs to
        another user, or the agent message has been deleted. This endpoint requires
        authentication.
      tags: [Conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Agent message edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AgentMessageNotFound'
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                blankContent:
                  summary: Content missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: content is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                contentTooLong:
                  summary: Content exceeds 4000 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: content must not exceed 4000 characters
                    timestamp: 2026-07-20T15:00:00Z
                aiReply:
                  summary: The agent message is an AI reply (issuer agent)
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: AI replies cannot be edited
                    timestamp: 2026-07-20T15:00:00Z

    delete:
      operationId: deleteAgentMessage
      summary: Delete a message from a conversation
      description: >-
        Soft-deletes an agent message (human prompt or AI reply) in a conversation the
        caller owns: the row is kept with deletedAt set, and the agent message is no
        longer returned or sent to the LLM as context. Returns 404 under the same
        conditions as PATCH. This endpoint requires authentication.
      tags: [Conversations]
      security:
        - bearerAuth: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: Agent message deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AgentMessageNotFound'

  # ──────────────── Hosts ────────────────
  /users/{userId}/hosts:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listHosts
      summary: List the hosts that accessed a user's account
      description: >-
        Returns the hosts (client IP addresses) recorded when registering or signing in to the user's
        account, most recently seen first. A superuser may list the hosts of a guest
        account or their own; a guest may list only their own. This endpoint requires
        authentication.
      tags: [Hosts]
      security:
        - bearerAuth: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Hosts, most recently seen first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Host'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HostForbidden'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: User not found
                timestamp: 2026-07-20T15:00:00Z

  /users/{userId}/hosts/{hostId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: hostId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateHostStatus
      summary: Ban or authorize a host
      description: >-
        Sets the status of a host recorded on the user's account and sets updatedAt.
        A banned host can no longer sign in to the account (POST /auth/login) or request
        an unlock link (POST /auth/unlock). Same access rules as
        GET /users/{userId}/hosts. On their own account, the caller cannot ban the host
        the request comes from, so they cannot lock themselves out. Returns 404 when
        the user or host does not exist or the host is recorded on another account.
        This endpoint requires authentication.
      tags: [Hosts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHostInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Host status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HostForbidden'
        '404':
          $ref: '#/components/responses/HostNotFound'
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                invalidStatus:
                  summary: Status missing or not authorized/banned
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: status must be authorized or banned
                    timestamp: 2026-07-20T15:00:00Z
                currentHost:
                  summary: The caller tried to ban the host the request comes from
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: You cannot ban the host you are using
                    timestamp: 2026-07-20T15:00:00Z

  # ──────────────── Event logs ────────────────
  /users/{userId}/hosts/{hostId}/logs:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: hostId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listEventLogs
      summary: List the event logs of a host (paginated)
      description: >-
        Returns the event logs recorded for a host of the user's account, newest first.
        Same access rules as GET /users/{userId}/hosts. Returns 404 when the user or
        host does not exist or the host is recorded on another account. This endpoint
        requires authentication.
      tags: [Event logs]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Event logs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventLog'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: Invalid pagination parameters
                timestamp: 2026-07-20T15:00:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HostForbidden'
        '404':
          $ref: '#/components/responses/HostNotFound'

  /users/{userId}/hosts/{hostId}/logs/{logId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: hostId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: logId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEventLog
      summary: Get an event log
      description: >-
        Returns one event log of a host of the user's account. Same access rules as
        GET /users/{userId}/hosts. Returns 404 when the user, host or event log does not
        exist, or it belongs to another host or account. This endpoint requires
        authentication.
      tags: [Event logs]
      security:
        - bearerAuth: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Event log found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HostForbidden'
        '404':
          description: User, host or event log not found, or it belongs to another host or account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: Event log not found
                timestamp: 2026-07-20T15:00:00Z

  # ──────────────── GeoIP ────────────────
  /geoip:
    get:
      operationId: getCurrentGeoIp
      summary: Get the geolocation and network details of the caller's IP
      description: >-
        Looks up the IP address the request comes from, the same address the caller's
        JWT is bound to, in MaxMind GeoLite2 City and ASN. Every field except ipAddress
        is null when MaxMind has no data for the address, for example a private or
        loopback IP. This endpoint requires authentication.
      tags: [GeoIP]
      security:
        - bearerAuth: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Details of the caller's IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIp'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /geoip/{ip}:
    get:
      operationId: getGeoIp
      summary: Get the geolocation and network details of an IP
      description: >-
        Looks up the given IPv4 or IPv6 address in MaxMind GeoLite2 City and ASN. Every
        field except ipAddress is null when MaxMind has no data for the address, for
        example a private or reserved IP. This endpoint is public.
      tags: [GeoIP]
      security: []
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
          description: IPv4 or IPv6 address, without a prefix length
          example: '2001:db8::1'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Details of the IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIp'
        '403':
          description: >-
            A bearer token was sent and it is bound to a different IP than the request's.
            The endpoint needs no token; send none to avoid this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Cannot access this resource from the current IP address.
                timestamp: 2026-07-20T15:00:00Z
        '400':
          description: The path is not a valid IPv4 or IPv6 address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: IP address 999.0.0.1 is not valid
                timestamp: 2026-07-20T15:00:00Z

components:
  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 401
            error: UNAUTHORIZED
            message: Missing or invalid authentication token
            timestamp: 2026-07-20T15:00:00Z

    BadRequest:
      description: Request body is malformed, or missing where required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 400
            error: BAD REQUEST
            message: Request body is missing or malformed.
            timestamp: 2026-07-20T15:00:00Z

    ConversationNotFound:
      description: Conversation not found or owned by another user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 404
            error: NOT FOUND
            message: Conversation not found
            timestamp: 2026-07-20T15:00:00Z

    AgentMessageNotFound:
      description: Conversation or agent message not found, conversation owned by another user, or agent message deleted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 404
            error: NOT FOUND
            message: Agent message not found
            timestamp: 2026-07-20T15:00:00Z

    HostForbidden:
      description: A guest targeted another account, or a superuser targeted another superuser
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 403
            error: FORBIDDEN
            message: Cannot access this resource.
            timestamp: 2026-07-20T15:00:00Z

    HostNotFound:
      description: User or host not found, or the host is recorded on another account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            status: 404
            error: NOT FOUND
            message: Host not found
            timestamp: 2026-07-20T15:00:00Z

    TooManyRequests:
      description: >-
        Rate limit exceeded. Every endpoint except GET /syn is limited per client IP (per /64 prefix for
        IPv6), with one
        bucket per tier: critical (POST /auth/**, POST /messages/{messageId}/ai-reply,
        POST /conversations and POST /conversations/{conversationId}, default
        10 requests/minute), sensitive
        (GET /auth/**, PATCH and DELETE /users/**, default 30/minute) and standard (everything
        else, default 120/minute). Configured by app.rate-limit.{critical,sensitive,standard}-per-minute.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            rateLimited:
              summary: Too many requests from this IP
              value:
                status: 429
                error: TOO MANY REQUESTS
                message: Too many requests. Please try again later.
                timestamp: 2026-07-20T15:00:00Z

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum: [superuser, guest]

    UserStatus:
      type: string
      enum: [active, inactive, locked]
      description: Account status

    MessageIssuer:
      type: string
      enum: [agent, human]
      description: Who wrote the content; agent when generated by the LLM

    # ── Auth ──
    RegisterInput:
      type: object
      required: [username, password, confirmPassword, firstName, lastName, email]
      properties:
        username:
          type: string
          maxLength: 50
          pattern: "^[a-zA-Z0-9_-]{2,}$"
          description: Letters, digits, underscores, and hyphens only; trimmed and lower-cased before storage, unique ignoring case
        password:
          type: string
          minLength: 12
          maxLength: 255
          writeOnly: true
          description: Must contain an uppercase letter, a lowercase letter, a digit, and a special character; must not contain line breaks or other control characters
        confirmPassword:
          type: string
          writeOnly: true
          description: Must match password
        firstName:
          type: string
          maxLength: 100
          pattern: '^[\p{L}\p{M}]+([ ''’-][\p{L}\p{M}]+)*$'
          description: Letters in any script, with single spaces, apostrophes, or hyphens between words; surrounding whitespace is trimmed
        lastName:
          type: string
          maxLength: 100
          pattern: '^[\p{L}\p{M}]+([ ''’-][\p{L}\p{M}]+)*$'
          description: Letters in any script, with single spaces, apostrophes, or hyphens between words; surrounding whitespace is trimmed
        email:
          type: string
          format: email
          maxLength: 100
          description: Trimmed and lower-cased before storage, unique ignoring case
      example:
        username: jdoe
        password: s3cur3P@ssw0rd!
        confirmPassword: s3cur3P@ssw0rd!
        firstName: John
        lastName: Doe
        email: jdoe@example.com

    LoginInput:
      type: object
      required: [password]
      properties:
        username:
          type: string
          description: Username to log in with
        email:
          type: string
          format: email
          maxLength: 100
          description: Email to log in with
        password:
          type: string
          writeOnly: true
      description: Provide either username or email (at least one required)
      example:
        username: jdoe
        password: s3cur3P@ss

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          $ref: '#/components/schemas/User'
      example:
        token: eyJhbG...AwfQ...
        user:
          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          username: jdoe
          firstName: John
          lastName: Doe
          email: jdoe@example.com
          role: guest
          userStatus: active
          createdAt: 2026-07-20T14:00:00Z
          updatedAt: null

    VerifyRegistrationResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          $ref: '#/components/schemas/User'
      example:
        token: eyJhbG...AwfQ...
        user:
          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          username: jdoe
          firstName: John
          lastName: Doe
          email: jdoe@example.com
          role: guest
          userStatus: active
          createdAt: 2026-07-20T14:00:00Z
          updatedAt: null

    # ── Read model ──
    User:
      type: object
      required: [id, username, firstName, lastName, email, role, userStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        role:
          $ref: '#/components/schemas/UserRole'
        userStatus:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        username: jdoe
        firstName: John
        lastName: Doe
        email: jdoe@example.com
        role: guest
        userStatus: active
        createdAt: 2026-07-20T14:00:00Z
        updatedAt: null

    # ── Update input ──
    UpdateUserInput:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
          pattern: "^[a-zA-Z0-9_-]{2,}$"
          description: Letters, digits, underscores, and hyphens only
        firstName:
          type: string
          maxLength: 100
          pattern: '^[\p{L}\p{M}]+([ ''’-][\p{L}\p{M}]+)*$'
          description: Letters in any script, with single spaces, apostrophes, or hyphens between words; surrounding whitespace is trimmed
        lastName:
          type: string
          maxLength: 100
          pattern: '^[\p{L}\p{M}]+([ ''’-][\p{L}\p{M}]+)*$'
          description: Letters in any script, with single spaces, apostrophes, or hyphens between words; surrounding whitespace is trimmed
      example:
        username: jdoe
        firstName: Jonathan
        lastName: Doe

    # ── Change password input ──
    ChangePasswordInput:
      type: object
      required: [oldPassword, newPassword, confirmNewPassword]
      properties:
        oldPassword:
          type: string
          writeOnly: true
          description: Current password for authentication
        newPassword:
          type: string
          minLength: 12
          maxLength: 255
          writeOnly: true
          description: New password to set
        confirmNewPassword:
          type: string
          writeOnly: true
          description: Must match newPassword
      example:
        oldPassword: oldP@ssw0rd!
        newPassword: n3w$ecur3P@ss!
        confirmNewPassword: n3w$ecur3P@ss!

    # ── Change email input ──
    ChangeEmailInput:
      type: object
      required: [newEmail, password]
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 100
          description: The new email address to switch to
        password:
          type: string
          writeOnly: true
          description: Current password for authentication
      example:
        newEmail: newemail@example.com
        password: s3cur3P@ss

    # ── Unlock account input ──
    UnlockAccountInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          description: Email of the locked account to unlock
      example:
        email: lockeduser@example.com

    # ── Messages ──
    Message:
      type: object
      required: [id, senderId, receiverId, replyTo, issuer, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
          nullable: true
          description: Null once the sender's account has been deleted
        receiverId:
          type: string
          format: uuid
          nullable: true
          description: Null once the receiver's account has been deleted
        replyTo:
          type: string
          format: uuid
          nullable: true
          description: ID of the message this one replies to
        issuer:
          $ref: '#/components/schemas/MessageIssuer'
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the message is edited
      example:
        id: c3d4e5f6-a7b8-9012-cdef-123456789012
        senderId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        receiverId: b2c3d4e5-f6a7-8901-bcde-f12345678901
        replyTo: null
        issuer: human
        content: Hi Alice, do you have a minute?
        createdAt: 2026-07-20T15:00:00Z
        updatedAt: null

    SendMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Cannot be blank
      example:
        content: Sure, go ahead.

    EditMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Cannot be blank
        replyTo:
          type: string
          format: uuid
          description: Optional. ID of another non-deleted message exchanged with the same user to reply to
      example:
        content: Hi Alice, do you have five minutes?
        replyTo: c3d4e5f6-a7b8-9012-cdef-123456789012

    # ── Conversations (AI agent) ──
    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 100
          description: Chosen by the AI from the first agent message; can be changed with PATCH /conversations/{conversationId}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the conversation is renamed
      example:
        id: e5f6a7b8-c9d0-1234-ef01-345678901234
        title: Three days in Lisbon
        createdAt: 2026-07-20T15:00:00Z
        updatedAt: null

    ConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Cannot be blank
      example:
        title: Trip planning

    AgentMessage:
      type: object
      required: [id, conversationId, issuer, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        issuer:
          $ref: '#/components/schemas/MessageIssuer'
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the message is edited
      example:
        id: f6a7b8c9-d0e1-2345-f012-456789012345
        conversationId: e5f6a7b8-c9d0-1234-ef01-345678901234
        issuer: human
        content: Suggest a three-day itinerary for Lisbon.
        createdAt: 2026-07-20T15:00:00Z
        updatedAt: null

    AgentMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Cannot be blank
      example:
        content: Suggest a three-day itinerary for Lisbon.

    # ── Hosts ──
    HostStatus:
      type: string
      enum: [authorized, banned]
      description: Banned hosts cannot sign in to the account

    Host:
      type: object
      required: [id, ipAddress, status, lastSeenAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ipAddress:
          type: string
          description: IPv4 or IPv6 address of the client
        status:
          $ref: '#/components/schemas/HostStatus'
        lastSeenAt:
          type: string
          format: date-time
          description: Last time this host registered or signed in to the account
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the status changes
      example:
        id: c9d0e1f2-a3b4-5678-2345-789012345678
        ipAddress: 203.0.113.42
        status: authorized
        lastSeenAt: 2026-07-20T14:00:00Z
        updatedAt: null

    UpdateHostInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/HostStatus'
      example:
        status: banned

    # ── Event logs ──
    EventLogSeverity:
      type: string
      enum: [info, low, medium, high, critical]

    EventLog:
      type: object
      required: [id, hostId, userAgent, severity, description, createdAt]
      properties:
        id:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        userAgent:
          type: string
          maxLength: 512
          description: User agent of the client that triggered the event
        severity:
          $ref: '#/components/schemas/EventLogSeverity'
        description:
          type: string
          maxLength: 100
          nullable: true
        createdAt:
          type: string
          format: date-time
      example:
        id: d0e1f2a3-b4c5-6789-3456-890123456789
        hostId: c9d0e1f2-a3b4-5678-2345-789012345678
        userAgent: Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0
        severity: medium
        description: Failed sign-in attempt
        createdAt: 2026-07-20T14:00:00Z

    # ── GeoIP ──
    GeoIp:
      description: MaxMind GeoLite2 City and ASN data for an IP; every field except ipAddress is null when MaxMind has no data for the address
      type: object
      required: [ipAddress, network, continentCode, continent, countryCode, country, registeredCountryCode, registeredCountry, subdivision1, subdivision2, city, postalCode, timezone, latitude, longitude, accuracyRadius, autonomousSystemNumber, autonomousSystemOrganization]
      properties:
        ipAddress:
          type: string
          description: The IPv4 or IPv6 address looked up
        network:
          type: string
          nullable: true
          description: MaxMind network (CIDR) that contains the address
        continentCode:
          type: string
          nullable: true
          description: Two-letter continent code
        continent:
          type: string
          nullable: true
          description: English continent name
        countryCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 code of the country where the address is located
        country:
          type: string
          nullable: true
          description: English name of the country where the address is located
        registeredCountryCode:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 code of the country where the ISP registered the network; can differ from countryCode
        registeredCountry:
          type: string
          nullable: true
          description: English name of the country where the ISP registered the network
        subdivision1:
          type: string
          nullable: true
          description: English name of the largest subdivision
        subdivision2:
          type: string
          nullable: true
          description: English name of the second-level subdivision
        city:
          type: string
          nullable: true
          description: English city name
        postalCode:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA time zone
        latitude:
          type: number
          format: double
          nullable: true
          description: Approximate; the address is within accuracyRadius of this point
        longitude:
          type: number
          format: double
          nullable: true
          description: Approximate; the address is within accuracyRadius of this point
        accuracyRadius:
          type: integer
          nullable: true
          description: Radius in kilometers around latitude and longitude where the address is likely located
        autonomousSystemNumber:
          type: integer
          format: int64
          nullable: true
          description: Number of the autonomous system that announces the address's network
        autonomousSystemOrganization:
          type: string
          nullable: true
          description: Organization running that autonomous system; usually the ISP for home and mobile connections, the hosting company for servers and VPNs
      example:
        ipAddress: 203.0.113.42
        network: 203.0.113.0/24
        continentCode: EU
        continent: Europe
        countryCode: PT
        country: Portugal
        registeredCountryCode: PT
        registeredCountry: Portugal
        subdivision1: Lisbon
        subdivision2: null
        city: Lisbon
        postalCode: 1000-001
        timezone: Europe/Lisbon
        latitude: 38.7167
        longitude: -9.1333
        accuracyRadius: 20
        autonomousSystemNumber: 3243
        autonomousSystemOrganization: MEO - SERVICOS DE COMUNICACOES E MULTIMEDIA S.A.

    # ── Simple message body ──
    MessageBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable message
      example:
        message: A verification link has been sent to your email

    # ── Shared error body ──
    ErrorBody:
      type: object
      required: [status, error, message, timestamp]
      properties:
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Short error type / code
        message:
          type: string
          description: Human-readable error description
        timestamp:
          type: string
          format: date-time
          description: When the error occurred

    Meta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          description: Current page number (1-indexed)
        size:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items across all pages
      example:
        page: 1
        size: 20
        total: 1
