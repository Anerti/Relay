                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource from the current IP address.
                    timestamp: 2026-07-20T15:00:00Z
                accountLocked:
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: This account is locked and cannot delete messages.
                    timestamp: 2026-07-20T15:00:00Z
                hostBanned:
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Host 203.0.113.7 is banned from accessing this account
