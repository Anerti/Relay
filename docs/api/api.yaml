openapi: 3.0.3
info:
  title: Relay API
  version: 0.1.0
  description: Relay REST API. Sign-up and sign-in confirmed by emailed links, JWT bearer auth bound to the client IP, password and email changes, account unlock, user management, direct messages between users with optional AI replies, conversations with an AI agent, the hosts that access each account with their ban status and event logs, and IP geolocation lookups.

servers:
  - url: http://localhost:8080

paths:
  # ──────────────── Health ────────────────
  /syn:
    get:
      operationId: syn
      summary: Health check
      description: Returns syn-ack if the application is running.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Application is up
          content:
            text/plain:
              schema:
                type: string
              example: syn-ack

  # ──────────────── Authentication ────────────────
  /auth/register:
    post:
      operationId: register
      summary: Register a new user account (pending verification)
      description: Validates the registration data, saves the user with verified=false, records the client's host (IP address) on the account with an info event log, generates a UUID verification token stored in Redis, and sends a verification link by email. Opening the link displays a confirmation page; the user must submit its form to POST /auth/mfa/confirm/register/{token} before logging in. The token expires after 15 minutes.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Validation passed, verification link sent by email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: An email has been sent to verify your account
        '400':
          description: Request body is missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: Request body is missing or malformed.
                timestamp: 2026-07-20T15:00:00Z
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 415
                error: UNSUPPORTED MEDIA TYPE
                message: Unsupported content type.
                timestamp: 2026-07-20T15:00:00Z
        '405':
          description: Method other than POST; the Allow header lists POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 405
                error: METHOD NOT ALLOWED
                message: Method not allowed.
                timestamp: 2026-07-20T15:00:00Z
        '406':
          description: Accept header excludes application/json; nothing is saved and no email is sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 406
                error: NOT ACCEPTABLE
                message: Not acceptable.
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 422
                error: UNPROCESSABLE CONTENT
                message: Password must be at least 12 characters
                timestamp: 2026-07-20T15:00:00Z
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                duplicateUsername:
                  value:
                    status: 409
                    error: CONFLICT
                    message: You cannot use this username
                    timestamp: 2026-07-20T15:00:00Z
                duplicateEmail:
                  value:
                    status: 409
                    error: CONFLICT
                    message: You cannot use this email address
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            A bearer token was sent and it is bound to a different IP than the request's.
            The endpoint needs no token; send none to avoid this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Cannot access this resource from the current IP address.
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email or another unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Something went wrong, please try again later
                timestamp: 2026-07-20T15:00:00Z

  /auth/login:
    post:
      operationId: login
      summary: Authenticate and request a verification link
      description: >-
        Validates credentials (username or email + password), records the client's host and
        rejects banned hosts, generates a UUID verification token stored in Redis, and sends a
        verification link by email. The token expires after 15 minutes. Opening the link
        displays a confirmation page; submit its form to complete login with
        POST /auth/mfa/confirm/login/{token}.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Credentials validated, verification link sent by email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: A verification link has been sent to your email
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                noIdentifier:
                  summary: Neither username nor email provided
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Username or email is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                bothIdentifiers:
                  summary: Both username and email provided
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Provide either username or email, not both
                    timestamp: 2026-07-20T15:00:00Z
                invalidEmail:
                  summary: Email format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Email not-an-email is not valid
                    timestamp: 2026-07-20T15:00:00Z
                invalidUsername:
                  summary: Username format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Username a is invalid
                    timestamp: 2026-07-20T15:00:00Z
                blankPassword:
                  summary: Password missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: password is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                wrongPassword:
                  summary: Unknown user or wrong password
                  value:
                    status: 401
                    error: UNAUTHORIZED
                    message: Invalid username/email or password.
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                accountLocked:
                  summary: Account locked due to too many failed attempts
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: This account has been locked after too many unsuccessful sign-in attempts.
                    timestamp: 2026-07-20T15:00:00Z
                accountNotVerified:
                  summary: Account not yet verified
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Verify your email address before signing in.
                    timestamp: 2026-07-20T15:00:00Z
                hostBanned:
                  summary: Client's host is banned from this account
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Host 203.0.113.42 is banned from accessing this account
                    timestamp: 2026-07-20T15:00:00Z

  /auth/resend-link:
    post:
      operationId: resendVerificationLink
      summary: Resend verification email
      description: >-
        Generates a new UUID verification token and sends a verification email
        for the given flow. The token expires after 15 minutes. Complete the
        flow by opening the link and submitting the confirmation form to the
        endpoint for that flow: POST /auth/mfa/confirm/register/{token},
        POST /auth/mfa/confirm/login/{token}, or
        POST /auth/mfa/confirm/change-email/{token}.
      tags: [Auth]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            maxLength: 100
          description: Email address of the account
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [login, unlock-account, change-email, change-password]
          description: >-
            Which verification flow to resend. When omitted, defaults to
            registration verification.
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Verification email regenerated and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              examples:
                registration:
                  summary: Registration verification resent
                  value:
                    message: A verification link has been sent to your email
                login:
                  summary: Login verification resent
                  value:
                    message: A verification link has been sent to your email
                unlockAccount:
                  summary: Unlock-account link resent
                  value:
                    message: A verification link has been sent to your email to unlock your account
                changeEmail:
                  summary: Change-email confirmation resent
                  value:
                    message: A verification link has been sent to your new email address
                changePassword:
                  summary: Change-password notification resent
                  value:
                    message: A verification link has been sent to your email
        '422':
          description: Email format validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                emailInvalid:
                  summary: Email format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Email must be a valid email address
                    timestamp: 2026-07-20T15:00:00Z
                invalidFlow:
                  summary: Unknown flow value
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Unknown flow value
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: No pending verification found for this email and flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: No pending verification found for this email
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send verification email
                timestamp: 2026-07-20T15:00:00Z

  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password
      description: >-
        Changes the password of the account identified by the bearer token. The body is validated
        first: the new password follows the registration password rules, must match
        confirmNewPassword, and must differ from oldPassword. The caller's host is then recorded and
        oldPassword is checked against the stored password; a wrong one is 401 and records a MEDIUM
        "[PASSWORD]: Operation failed due to invalid credentials" event. A locked account, an unverified
        account, or a host banned for the account is 403 and records a MEDIUM
        "[PASSWORD]: Operation failed due to locked account", "... unverified account" or
        "... banned host" event; inactive accounts can still change their password. The new password
        takes effect immediately, with no verification link, and records an INFO
        "[PASSWORD]: Password changed" event. A notification is emailed to the account's registered
        address with the client IP and its GeoIP details (continent, country, city, timezone,
        latitude, longitude, accuracy radius, AS organization; N/A when the lookup fails), the user
        agent and the time of the change; the send is synchronous, so a mail failure returns 500 and
        rolls the change back. Tokens issued before the change stay
        valid until they expire. Any role, or none, may change its own password. This endpoint
        requires authentication.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: Password changed successfully
        '400':
          description: Request body is missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: Request body is missing or malformed.
                timestamp: 2026-07-20T15:00:00Z
        '401':
          description: >-
            Missing or invalid authentication token, wrong oldPassword, or the token's account no
            longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                missingToken:
                  summary: Missing or invalid authentication token
                  value:
                    status: 401
                    error: UNAUTHORIZED
                    message: Authentication required.
                    timestamp: 2026-07-20T15:00:00Z
                wrongCredentials:
                  summary: Wrong oldPassword, or the account no longer exists
                  value:
                    status: 401
                    error: UNAUTHORIZED
                    message: Invalid credentials
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            The account is locked or unverified, the caller's IP is banned for this account, or the
            token is bound to a different IP than the request's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                accountLocked:
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: This account is locked and cannot change its password.
                    timestamp: 2026-07-20T15:00:00Z
                accountNotVerified:
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Account has not been verified
                    timestamp: 2026-07-20T15:00:00Z
                hostBanned:
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Host 203.0.113.7 is banned from accessing this account
                    timestamp: 2026-07-20T15:00:00Z
                ipMismatch:
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource from the current IP address.
                    timestamp: 2026-07-20T15:00:00Z
        '406':
          description: Accept header excludes application/json; nothing is changed or recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 406
                error: NOT ACCEPTABLE
                message: Not acceptable.
                timestamp: 2026-07-20T15:00:00Z
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 415
                error: UNSUPPORTED MEDIA TYPE
                message: Unsupported content type.
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure; nothing is recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                oldPasswordBlank:
                  summary: oldPassword missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: oldPassword is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                oldPasswordTooLong:
                  summary: oldPassword exceeds 255 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: oldPassword must not exceed 255 characters
                    timestamp: 2026-07-20T15:00:00Z
                passwordTooShort:
                  summary: New password too short
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: New password must be at least 12 characters
                    timestamp: 2026-07-20T15:00:00Z
                passwordTooLong:
                  summary: New password exceeds 255 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: newPassword must not exceed 255 characters
                    timestamp: 2026-07-20T15:00:00Z
                passwordTooWeak:
                  summary: New password misses a character class
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: New password must contain at least one special character
                    timestamp: 2026-07-20T15:00:00Z
                passwordsDoNotMatch:
                  summary: Passwords do not match
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Passwords do not match
                    timestamp: 2026-07-20T15:00:00Z
                passwordReused:
                  summary: Password reused
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Cannot use this password
                    timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send password-change notification email; the password is not changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send password-change notification email
                timestamp: 2026-07-20T15:00:00Z

  /auth/change-email:
    post:
      operationId: changeEmail
      summary: Request an email change
      description: Validates the caller's current credentials (username or email + password), generates a         UUID verification token stored in Redis, and sends a confirmation link by email to the new address. The token expires after 15 minutes. Opening the link displays a confirmation page; submit its form to POST /auth/mfa/confirm/change-email/{token} to complete the email change. The old email remains in use until the new address is verified. This endpoint requires authentication.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Credentials validated, verification link sent to the new email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: A verification link has been sent to your new email address
        '401':
          description: Missing or invalid authentication token or wrong credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid credentials
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 422
                error: UNPROCESSABLE CONTENT
                message: New email must be a valid email address
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Account not verified or business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Account has not been verified
                timestamp: 2026-07-20T15:00:00Z
        '409':
          description: The new email is already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 409
                error: CONFLICT
                message: This email address is already in use
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send verification email
                timestamp: 2026-07-20T15:00:00Z

  /auth/unlock:
    post:
      operationId: unlockAccount
      summary: Request to unlock a locked user account
      description: >-
        Public recovery endpoint. Submit the email of a LOCKED account to receive an
        unlock link by email; open the link and submit its confirmation form to
        complete the unlock. Returns
        403 if the account is not found or not locked, and 422 if the email is invalid.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockAccountInput'
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Verification link sent by email to unlock the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: A verification link has been sent to your email to unlock your account
        '403':
          description: >-
            Request rejected. Returned when the account is not found or not locked
            (same message in both cases, so account existence is not revealed), or when
            the requesting host is banned from accessing the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                accountNotLocked:
                  summary: Account not found or not locked
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Account not locked
                    timestamp: 2026-07-20T15:00:00Z
                hostBanned:
                  summary: Requesting host is banned
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Host <ip> is banned from accessing this account
                    timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure on the email field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                emailRequired:
                  summary: Email missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: email is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                emailTooLong:
                  summary: Email exceeds 100 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: email must not exceed 100 characters
                    timestamp: 2026-07-20T15:00:00Z
                emailInvalid:
                  summary: Email format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Email <value> is not valid
                    timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send verification email
                timestamp: 2026-07-20T15:00:00Z

  # ──────────────── MFA ────────────────
  /auth/verify/{token}:
    get:
      operationId: showVerificationConfirmation
      summary: Display the verification confirmation page
      description: >-
        Displays a confirmation page without consuming the token or changing account state.
        The user must submit the form to the confirmation endpoint for the flow:
        POST /auth/mfa/confirm/register/{token} or POST /auth/mfa/confirm/login/{token}.
        The page reads the token's flow from Redis to choose the form target; unknown,
        expired or malformed tokens, or a Redis failure, still get the page with the
        registration form target, and the confirmation endpoint answers 401.
      tags: [MFA]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID verification token sent by email
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Confirmation page
          headers:
            Cache-Control:
              description: Keeps the token-bearing page out of caches
              schema:
                type: string
                example: no-store
            Referrer-Policy:
              description: Keeps the token out of the Referer header
              schema:
                type: string
                example: no-referrer
          content:
            text/html:
              schema:
                type: string
        '403':
          description: >-
            A bearer token was sent and it is bound to a different IP than the request's.
            The endpoint needs no token; send none to avoid this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Cannot access this resource from the current IP address.
                timestamp: 2026-07-20T15:00:00Z

  /auth/mfa/confirm/register/{token}:
    post:
      operationId: confirmRegistration
      summary: Verify registration email
      description: >-
        Validates and consumes a one-time UUID registration token from the path, marks the
        user as verified, records the caller's host (IP address) on the account with an info
        event log, and returns a JWT bound to the caller's IP and the user details. The token
        expires after 15 minutes. It is consumed even when the request fails with 401,
        so a rejected token cannot be retried.
      tags: [MFA]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID registration verification token sent by email
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Registration email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '401':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid or expired token
                timestamp: 2026-07-20T15:00:00Z
        '406':
          description: Accept header excludes application/json; the token is not consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 406
                error: NOT ACCEPTABLE
                message: Not acceptable.
                timestamp: 2026-07-20T15:00:00Z
        '403':
