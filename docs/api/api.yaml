openapi: 3.0.3
info:
  title: Relay API
  version: 0.1.0
  description: Relay REST API. Sign-up and sign-in confirmed by emailed links, JWT bearer auth bound to the client IP, password and email changes, account unlock, user management, direct messages between users with optional AI replies, conversations with an AI agent, the hosts that access each account with their ban status and event logs, and IP geolocation lookups.

servers:
  - url: http://localhost:8080

paths:
  # ──────────────── Health ────────────────
  /syn:
    get:
      operationId: syn
      summary: Health check
      description: Returns syn-ack if the application is running.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Application is up
          content:
            text/plain:
              schema:
                type: string
              example: syn-ack

  # ──────────────── Authentication ────────────────
  /auth/register:
    post:
      operationId: register
      summary: Register a new user account (pending verification)
      description: Validates the registration data, saves the user with verified=false, records the client's host (IP address) on the account with an info event log, generates a UUID verification token stored in Redis, and sends a verification link by email. Opening the link displays a confirmation page; the user must submit its form to POST /auth/mfa/confirm/register/{token} before logging in. The token expires after 15 minutes.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Validation passed, verification link sent by email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: An email has been sent to verify your account
        '400':
          description: Request body is missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: Request body is missing or malformed.
                timestamp: 2026-07-20T15:00:00Z
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 415
                error: UNSUPPORTED MEDIA TYPE
                message: Unsupported content type.
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 422
                error: UNPROCESSABLE CONTENT
                message: Password must be at least 12 characters
                timestamp: 2026-07-20T15:00:00Z
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                duplicateUsername:
                  value:
                    status: 409
                    error: CONFLICT
                    message: You cannot use this username
                    timestamp: 2026-07-20T15:00:00Z
                duplicateEmail:
                  value:
                    status: 409
                    error: CONFLICT
                    message: You cannot use this email address
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            A bearer token was sent and it is bound to a different IP than the request's.
            The endpoint needs no token; send none to avoid this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Cannot access this resource from the current IP address.
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email or another unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Something went wrong, please try again later
                timestamp: 2026-07-20T15:00:00Z

  /auth/login:
    post:
      operationId: login
      summary: Authenticate and request a verification link
      description: >-
        Validates credentials (username or email + password), records the client's host and
        rejects banned hosts, generates a UUID verification token stored in Redis, and sends a
        verification link by email. The token expires after 15 minutes. Opening the link
        displays a confirmation page; submit its form to complete login with
        POST /auth/mfa/confirm/login/{token}.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Credentials validated, verification link sent by email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: A verification link has been sent to your email
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                noIdentifier:
                  summary: Neither username nor email provided
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Username or email is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                invalidEmail:
                  summary: Email format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Email not-an-email is not valid
                    timestamp: 2026-07-20T15:00:00Z
                invalidUsername:
                  summary: Username format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Username a is invalid
                    timestamp: 2026-07-20T15:00:00Z
                blankPassword:
                  summary: Password missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: password is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                wrongPassword:
                  summary: Unknown user or wrong password
                  value:
                    status: 401
                    error: UNAUTHORIZED
                    message: Invalid username/email or password.
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                accountLocked:
                  summary: Account locked due to too many failed attempts
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: This account has been locked after too many unsuccessful sign-in attempts. Request an account-unlock link to regain access.
                    timestamp: 2026-07-20T15:00:00Z
                accountNotVerified:
                  summary: Account not yet verified
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Verify your email address before signing in.
                    timestamp: 2026-07-20T15:00:00Z
                hostBanned:
                  summary: Client's host is banned from this account
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Host 203.0.113.42 is banned from accessing this account
                    timestamp: 2026-07-20T15:00:00Z

  /auth/resend-link:
    post:
      operationId: resendVerificationLink
      summary: Resend verification email
      description: >-
        Generates a new UUID verification token and sends a verification email
        for the given flow. The token expires after 15 minutes. Complete the
        flow by opening the link and submitting the confirmation form to the
        endpoint for that flow: POST /auth/mfa/confirm/register/{token},
        POST /auth/mfa/confirm/login/{token}, or
        POST /auth/mfa/confirm/change-email/{token}.
      tags: [Auth]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
            maxLength: 100
          description: Email address of the account
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [login, unlock-account, change-email, change-password]
          description: >-
            Which verification flow to resend. When omitted, defaults to
            registration verification.
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Verification email regenerated and sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              examples:
                registration:
                  summary: Registration verification resent
                  value:
                    message: A verification link has been sent to your email
                login:
                  summary: Login verification resent
                  value:
                    message: A verification link has been sent to your email
                unlockAccount:
                  summary: Unlock-account link resent
                  value:
                    message: A verification link has been sent to your email to unlock your account
                changeEmail:
                  summary: Change-email confirmation resent
                  value:
                    message: A verification link has been sent to your new email address
                changePassword:
                  summary: Change-password notification resent
                  value:
                    message: A verification link has been sent to your email
        '422':
          description: Email format validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                emailInvalid:
                  summary: Email format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Email must be a valid email address
                    timestamp: 2026-07-20T15:00:00Z
                invalidFlow:
                  summary: Unknown flow value
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Unknown flow value
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: No pending verification found for this email and flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: No pending verification found for this email
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send verification email
                timestamp: 2026-07-20T15:00:00Z

  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password
      description: Validates the caller's current credentials (username or email + current password), confirms the new password matches the confirmation field, and changes the password immediately — no verification link or click is required. An email notification is sent to the account's registered address informing the user that the password was changed, including the client IP, user agent, and timestamp of the change. This endpoint requires authentication.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: Password changed successfully
        '401':
          description: Missing or invalid authentication token or wrong credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid credentials
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                passwordTooShort:
                  summary: Password too short
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: New password must be at least 12 characters
                    timestamp: 2026-07-20T15:00:00Z
                passwordsDoNotMatch:
                  summary: Passwords do not match
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Passwords do not match
                    timestamp: 2026-07-20T15:00:00Z
                passwordReused:
                  summary: Password reused
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: New password must differ from the current password
                    timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Account not verified or business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Account has not been verified
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send password-change notification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send password-change notification email
                timestamp: 2026-07-20T15:00:00Z

  /auth/change-email:
    post:
      operationId: changeEmail
      summary: Request an email change
      description: Validates the caller's current credentials (username or email + password), generates a         UUID verification token stored in Redis, and sends a confirmation link by email to the new address. The token expires after 15 minutes. Opening the link displays a confirmation page; submit its form to POST /auth/mfa/confirm/change-email/{token} to complete the email change. The old email remains in use until the new address is verified. This endpoint requires authentication.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Credentials validated, verification link sent to the new email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: A verification link has been sent to your new email address
        '401':
          description: Missing or invalid authentication token or wrong credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid credentials
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 422
                error: UNPROCESSABLE CONTENT
                message: New email must be a valid email address
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Account not verified or business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Account has not been verified
                timestamp: 2026-07-20T15:00:00Z
        '409':
          description: The new email is already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 409
                error: CONFLICT
                message: This email address is already in use
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send verification email
                timestamp: 2026-07-20T15:00:00Z

  /auth/unlock:
    post:
      operationId: unlockAccount
      summary: Request to unlock a locked user account
      description: >-
        Public recovery endpoint. Submit the email of a LOCKED account to receive an
        unlock link by email; open the link and submit its confirmation form to
        complete the unlock. Returns
        403 if the account is not found or not locked, and 422 if the email is invalid.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockAccountInput'
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '202':
          description: Verification link sent by email to unlock the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: A verification link has been sent to your email to unlock your account
        '403':
          description: >-
            Request rejected. Returned when the account is not found or not locked
            (same message in both cases, so account existence is not revealed), or when
            the requesting host is banned from accessing the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                accountNotLocked:
                  summary: Account not found or not locked
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Account not locked
                    timestamp: 2026-07-20T15:00:00Z
                hostBanned:
                  summary: Requesting host is banned
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Host <ip> is banned from accessing this account
                    timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure on the email field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                emailRequired:
                  summary: Email missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: email is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                emailTooLong:
                  summary: Email exceeds 100 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: email must not exceed 100 characters
                    timestamp: 2026-07-20T15:00:00Z
                emailInvalid:
                  summary: Email format invalid
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Email <value> is not valid
                    timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send verification email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to send verification email
                timestamp: 2026-07-20T15:00:00Z

  # ──────────────── MFA ────────────────
  /auth/verify/{token}:
    get:
      operationId: showVerificationConfirmation
      summary: Display the verification confirmation page
      description: >-
        Displays a confirmation page without consuming the token or changing account state.
        The user must submit the form to the confirmation endpoint for the flow:
        POST /auth/mfa/confirm/register/{token} or POST /auth/mfa/confirm/login/{token}.
      tags: [MFA]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID verification token sent by email
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Confirmation page
          content:
            text/html:
              schema:
                type: string

  /auth/mfa/confirm/register/{token}:
    post:
      operationId: confirmRegistration
      summary: Verify registration email
      description: >-
        Validates and consumes a one-time UUID registration token from the path, marks the
        user as verified, and returns a JWT and user details. The token expires after
        15 minutes.
      tags: [MFA]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID registration verification token sent by email
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Registration email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '401':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid or expired token
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Account is locked or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Account is locked or inactive. Please request account access restoration to continue.
                timestamp: 2026-07-20T15:00:00Z

  /auth/mfa/confirm/login/{token}:
    post:
      operationId: confirmLogin
      summary: Confirm sign-in
      description: >-
        Validates and consumes a one-time UUID login token from the path, then returns
        a JWT and user details for the already verified user. The token expires after
        15 minutes.
      tags: [MFA]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID login verification token sent by email
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Sign-in confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRegistrationResponse'
        '401':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid or expired token
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Account is locked, inactive, or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                accountLocked:
                  summary: Account locked or inactive
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Account is locked or inactive. Please request account access restoration to continue.
                    timestamp: 2026-07-20T15:00:00Z
                accountNotVerified:
                  summary: Account not yet verified
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Verify your email address before signing in.
                    timestamp: 2026-07-20T15:00:00Z

  /auth/mfa/confirm/change-email/{token}:
    post:
      operationId: confirmEmailChange
      summary: Confirm email change
      description: >-
        Validates and consumes a one-time UUID change-email token from the path and
        switches the account's address to the new email. The token expires after
        15 minutes.
      tags: [MFA]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID change-email verification token sent to the new address
      security: []
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Email address changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageBody'
              example:
                message: Email address changed successfully
        '401':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Invalid or expired token
                timestamp: 2026-07-20T15:00:00Z
        '409':
          description: The new email is already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 409
                error: CONFLICT
                message: This email address is already in use
                timestamp: 2026-07-20T15:00:00Z

  # ──────────────── Users CRUD ────────────────
  /users:
    get:
      operationId: listUsers
      summary: List users (paginated, superuser only)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: '^[0-9a-zA-Z.@_\- éèê]*$'
          description: >-
            Optional filter by username, first name, last name, or email (partial
            match). Only letters, digits, dot, @, underscore, hyphen, space, and
            éèê are accepted.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: >-
            Sort order by account creation date. `asc` (default) lists oldest
            accounts first; `desc` reverses the order to list newest first.
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [superuser, guest]
            default: guest
          description: >-
            Optional filter that returns only users matching the given role.
            Defaults to `guest` when omitted.
            Any value other than `superuser` is treated as `guest`.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Missing or invalid authentication token
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: Insufficient permissions (superuser role required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 403
                error: FORBIDDEN
                message: Insufficient privileges.
