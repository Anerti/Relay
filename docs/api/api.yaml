                senderId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                receiverId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                replyTo: c3d4e5f6-a7b8-9012-cdef-123456789012
                content: Sure, I have a few minutes now. What's up?
                issuer: agent
                createdAt: 2026-07-20T15:01:00Z
                updatedAt: null
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Missing or invalid authentication token
                timestamp: 2026-07-20T15:00:00Z
        '404':
          description: Message not found, not received by the caller, deleted, or its sender no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: Message not found
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: The LLM failed to generate a reply, or another unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 500
                error: INTERNAL SERVER ERROR
                message: Failed to generate a reply, please try again later
                timestamp: 2026-07-20T15:00:00Z

