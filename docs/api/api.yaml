              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Authentication required.
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: The token is bound to a different IP than the request's, the caller's account is locked, or the caller's IP is banned for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
