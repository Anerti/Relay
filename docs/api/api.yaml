        Returns all messages exchanged between the caller and the given user in
        chronological order (oldest first). Deleted messages are not returned. An unknown user, or a user the caller
        has never exchanged messages with, gives an empty list. This endpoint requires
        authentication.
      tags: [Messages]
      security:
