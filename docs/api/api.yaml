          schema:
            type: string
            format: uuid
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '204':
          description: User deleted
        '400':
          description: userId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: 'Invalid parameter: userId'
                timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Authentication required.
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            The userId is not the caller's own, or the token is bound to a different IP
            than the request's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                otherAccount:
                  summary: Not the caller's account
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource.
                    timestamp: 2026-07-20T15:00:00Z
                otherIp:
                  summary: Token bound to another IP address
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource from the current IP address.
                    timestamp: 2026-07-20T15:00:00Z
        '404':
          description: The caller's own account no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: User not found
                timestamp: 2026-07-20T15:00:00Z
        '500':
          description: Failed to send account-deletion notification email
          content:
