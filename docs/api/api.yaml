  # ──────────────── Users CRUD ────────────────
  /users:
    get:
      operationId: listUsers
      summary: List users (paginated, superuser only)
      description: >-
        Returns one page of accounts with the given role, sorted by creation date.
        Only a superuser may call it; any other caller gets 403 before the query runs.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
            pattern: '^[0-9a-zA-Z.@_\- éèê]*$'
          description: >-
            Optional filter by username, first name, last name, or email (partial,
            case-insensitive match; `_` and `.` match literally). Only letters, digits,
            dot, @, underscore, hyphen, space, and éèê are accepted.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: >-
            Sort order by account creation date. `asc` (default) lists oldest
            accounts first; `desc` reverses the order to list newest first.
            Any value other than `desc` is treated as `asc`.
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [superuser, guest]
            default: guest
          description: >-
            Optional filter that returns only users matching the given role.
            Defaults to `guest` when omitted.
            Any value other than `superuser` is treated as `guest`.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    nullable: true
                    description: The page's users, or `null` when no account matches
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Authentication required.
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            The caller is not a superuser (a guest, or a token without a role), or the
            token is bound to a different IP than the request's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                notSuperuser:
                  summary: Superuser role required
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Insufficient privileges.
                    timestamp: 2026-07-20T15:00:00Z
                otherIp:
                  summary: Token bound to another IP address
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource from the current IP address.
                    timestamp: 2026-07-20T15:00:00Z
        '400':
          description: >-
            Invalid pagination parameters (`page` below 1, `size` outside 1 to 100,
            or a page starting past item 2147483647), or `page` / `size` is not an integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                outOfRange:
                  summary: page or size out of range
                  value:
                    status: 400
                    error: BAD REQUEST
                    message: Invalid pagination parameters
                    timestamp: 2026-07-20T15:00:00Z
                notAnInteger:
                  summary: page or size is not an integer
                  value:
                    status: 400
                    error: BAD REQUEST
                    message: 'Invalid parameter: page'
                    timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Invalid search parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                searchTooLong:
                  summary: Search exceeds 100 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: search must not exceed 100 characters
                    timestamp: 2026-07-20T15:00:00Z
                searchInvalidCharacters:
                  summary: Search contains disallowed characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: "Search may only contain letters, digits, dot, @, underscore, hyphen, space, and éèê"
                    timestamp: 2026-07-20T15:00:00Z

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user by ID
      description: >-
        Returns the user's account. A superuser may get a guest account or their own;
        a guest may get only their own. Returns 404 when the user does not exist, before
        the access check. This endpoint requires authentication.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: userId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: 'Invalid parameter: userId'
                timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Authentication required.
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            A guest targeted another account, a superuser targeted another superuser,
            the token carries no role, or the token is bound to a different IP than the request's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                otherAccount:
                  summary: Account not accessible to the caller
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource.
                    timestamp: 2026-07-20T15:00:00Z
                noRole:
                  summary: Token carries no role
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Insufficient privileges to access this resource
                    timestamp: 2026-07-20T15:00:00Z
                otherIp:
                  summary: Token bound to another IP address
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource from the current IP address.
                    timestamp: 2026-07-20T15:00:00Z
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: User not found
                timestamp: 2026-07-20T15:00:00Z

    patch:
      operationId: updateUser
      summary: Update a user
      description: >-
        Updates the caller's own username, first name or last name. Omitted or null fields
        are left unchanged, so an empty object returns the account as is. Only the account
        owner may update it, whatever their role: a userId other than the token's subject is
        403 before any lookup, and the caller's own account no longer existing is 404. An
        unverified account is 403 and records the caller's host and a MEDIUM "[PROFILE]: Update
        failed due to unverified account" event. Changing the username, first name or last name records the
        caller's host and an INFO "[PROFILE]: Profile data changed" event. Concurrent updates of different fields do
        not overwrite each other. The body is validated before the access check. This endpoint
        requires authentication.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: userId is not a valid UUID, or the body is missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                invalidUserId:
                  value:
                    status: 400
                    error: BAD REQUEST
                    message: 'Invalid parameter: userId'
                    timestamp: 2026-07-20T15:00:00Z
                malformedBody:
                  value:
                    status: 400
                    error: BAD REQUEST
                    message: Request body is missing or malformed.
                    timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Authentication required.
                timestamp: 2026-07-20T15:00:00Z
        '403':
          description: >-
            The userId is not the caller's own, the account is unverified, or the token is
            bound to a different IP than the request's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                otherAccount:
                  summary: Not the caller's account
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource.
                    timestamp: 2026-07-20T15:00:00Z
                notVerified:
                  summary: Account not verified
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Verify your email address before updating your profile.
                    timestamp: 2026-07-20T15:00:00Z
                otherIp:
                  summary: Token bound to another IP address
                  value:
                    status: 403
                    error: FORBIDDEN
                    message: Cannot access this resource from the current IP address.
                    timestamp: 2026-07-20T15:00:00Z
        '404':
          description: The caller's own account no longer exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: User not found
                timestamp: 2026-07-20T15:00:00Z
        '406':
          description: Accept header excludes application/json; nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 406
                error: NOT ACCEPTABLE
                message: Not acceptable.
                timestamp: 2026-07-20T15:00:00Z
        '409':
          description: Username already used by another account, ignoring case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
