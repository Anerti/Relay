              example:
                status: 422
                error: UNPROCESSABLE CONTENT
                message: Username a is invalid
                timestamp: 2026-07-20T15:00:00Z

    delete:
      operationId: deleteUser
      summary: Delete a user
      description: >-
        Deletes the caller's own account and sends a deletion-notification email,
        including the request's IP address and user agent, to the account's registered
        address. Only the owner may delete an account, whatever the role: a userId other
        than the caller's is 403 before any lookup, and 404 means the caller's own account
        no longer exists. The email send is synchronous, so a mail failure returns 500 and
        rolls the deletion back. The account's hosts and event logs are kept,
        detached from the deleted account. This endpoint requires authentication.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
