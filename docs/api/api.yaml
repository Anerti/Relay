      operationId: aiReplyToMessage
      summary: Reply to a message with AI
      description: >-
        Generates a reply to a direct message the caller received, using an LLM with the
        messages exchanged with its sender as context, and sends it on the caller's behalf:
        senderId is the caller, replyTo is messageId and issuer is agent. Returns 404
