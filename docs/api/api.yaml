                conversationId: e5f6a7b8-c9d0-1234-ef01-345678901234
                issuer: agent
                content: Start with Alfama and the castle on day one, Belém on day two, and Sintra on day three.
                createdAt: 2026-07-20T15:00:03Z
                updatedAt: null
