                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: content must not exceed 4000 characters
                    timestamp: 2026-07-20T15:00:00Z

  /messages/{messageId}:
    patch:
      operationId: editMessage
      summary: Edit a direct message
      description: >-
        Replaces the content of a direct message the caller sent and sets updatedAt.
        When replyTo is given, the message becomes a reply to it; it must be the ID of
        another non-deleted message exchanged with the same user. Returns 404 when the message does not exist, was not sent by the caller, is not
        a direct message, or has been deleted, so other users' messages are not
        revealed. This endpoint requires authentication.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageInput'
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '200':
          description: Message edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Request body is missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 400
                error: BAD REQUEST
                message: Request body is missing or malformed.
                timestamp: 2026-07-20T15:00:00Z
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 401
                error: UNAUTHORIZED
                message: Missing or invalid authentication token
                timestamp: 2026-07-20T15:00:00Z
        '404':
          description: Message not found, not sent by the caller, or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                status: 404
                error: NOT FOUND
                message: Message not found
                timestamp: 2026-07-20T15:00:00Z
        '422':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                blankContent:
                  summary: Content missing or blank
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: content is required and cannot be blank
                    timestamp: 2026-07-20T15:00:00Z
                contentTooLong:
                  summary: Content exceeds 4000 characters
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: content must not exceed 4000 characters
                    timestamp: 2026-07-20T15:00:00Z
                invalidReply:
                  summary: replyTo is the message itself, not a message exchanged with the same user, or it was deleted
                  value:
                    status: 422
                    error: UNPROCESSABLE CONTENT
                    message: Cannot reply to this message
                    timestamp: 2026-07-20T15:00:00Z

    delete:
      operationId: deleteMessage
      summary: Delete a direct message
      description: >-
        Soft-deletes a direct message the caller sent: the row is kept with deletedAt
        set, and the message can no longer be edited or replied to and is no longer listed. Returns 404 under
        the same conditions as PATCH /messages/{messageId}, so deleting an already deleted message is 404, and
        when the caller's own account no longer exists. Any role, or none, may delete its own messages; a
        superuser cannot delete other users' messages. Deleting records the caller's host and an INFO
        "[MESSAGE]: Message {messageId} deleted" event. A locked caller account, or a caller IP banned for this
        account, is 403 and records the host plus a MEDIUM "[MESSAGE]: Delete failed due to locked account" or
        "[MESSAGE]: Delete failed due to banned host" event; inactive accounts can still delete. 404s record
        nothing. This endpoint requires authentication.
      tags: [Messages]
      security:
